spring:
  application:
    name: rent-erp

  # ── DataSource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RentErpPool
      minimum-idle: 5
      maximum-pool-size: 20          # Higher pool suits virtual-thread concurrency
      idle-timeout: 300000           # 5 min
      connection-timeout: 20000      # 20 s
      max-lifetime: 1200000          # 20 min
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate             # Schema owned by Flyway — Hibernate validates only
    show-sql: false                  # SQL logged via Log4j2 (org.hibernate.SQL=DEBUG)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        connection.provider_disables_autocommit: false
        jdbc.time_zone: UTC

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Uploads (POST /api/v1/files) ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Virtual Threads (Java 25 / Spring Boot 4.1) ──────────────────────────────
  threads:
    virtual:
      enabled: true

  # (H17) The old spring.security.user block (DEV_SECURITY_USER / _PASSWORD) is
  # gone: every login is the JWT flow under /api/v1/auth.

# ── Application ─────────────────────────────────────────────────────────────────
app:
  env: ${APP_ENV}                     # local | staging | production
  auth:
    jwt-secret: ${JWT_SECRET}         # >= 32 characters; signs access tokens
    # Requests without a token are rejected unless AUTH_ENFORCED=false
    # (developer .env only, to run the pre-auth Postman collections).
    enforce: ${AUTH_ENFORCED:true}
    access-token-minutes: 15
    refresh-token-days: 30
    max-sessions-per-user: ${MAX_SESSIONS_PER_USER:10}   # M16: older sessions end beyond this
    otp:
      ttl-seconds: 300                # a code lives 5 minutes
      resend-after-seconds: 45        # wait before asking for another code
      max-sends-per-hour: 5           # per phone + purpose
      max-attempts: 5                 # wrong tries before the code is burned
      verification-token-minutes: 15  # sign-up proof lifetime
      # DEV ONLY: when set (6 digits), every OTP is this code. Honoured only with
      # APP_ENV=local; startup fails if it is set in any other environment.
      dev-fixed-code: ${OTP_DEV_FIXED_CODE:}
    password:
      max-failed-attempts: 5          # in a row, before the password login locks
      lock-minutes: 15
  files:
    # Uploaded files. Local folder in development; switching to S3 / Supabase
    # Storage replaces LocalFileStorage, not this API.
    local-dir: ${FILES_DIR:./uploads}
    max-bytes: 5242880                # 5 MB per file
    max-uploads-per-day: ${FILES_MAX_UPLOADS_PER_DAY:100}     # M21: per user, rolling 24 h
    max-total-mb-per-user: ${FILES_MAX_TOTAL_MB_PER_USER:500} # M21: kept per user (deleted files excluded)

  # ── Email (SMTP) ─────────────────────────────────────────────────────────────
  # Empty MAIL_HOST = no email: codes to an email address go to the OTP sender
  # (the backend log in local, a 503 elsewhere) and support tickets are only
  # stored. See common/mail/MailGateway and docs/devlog/DEVLOG_PASSWORD_RESET.md.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}               # e.g. Rentlo <no-reply@rentlo.app>
    starttls: ${MAIL_STARTTLS:true}   # port 587
    ssl: ${MAIL_SSL:false}            # true for port 465

  # ── Support (Contact Support tickets, V29) ────────────────────────────────────
  # New tickets are emailed here when email is configured; empty = stored only
  # (read them with GET /api/v1/admin/support/tickets).
  support:
    inbox: ${SUPPORT_INBOX:}

  # ── Request limits (H11) ──────────────────────────────────────────────────────
  # Counted in PostgreSQL (rate_limit_counters), shared by all instances.
  # RATE_LIMIT_ENABLED=false only on a developer machine running the live scripts.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

  # ── Browser origins allowed to call the API (H17) ─────────────────────────────
  # Comma-separated, e.g. https://admin.rentlo.app. Empty = none (the mobile app
  # does not need CORS).
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

  tenancy:
    join-request-ttl-hours: ${JOIN_REQUEST_TTL_HOURS:168}   # H12: 7 days for the owner to answer

  # ── Daily clean-up (M16) ──────────────────────────────────────────────────────
  housekeeping:
    cron: "0 15 3 * * *"              # 03:15 Asia/Kathmandu
    otp-retention-days: 7
    session-retention-days: 90

# ── db-scheduler ────────────────────────────────────────────────────────────────
db-scheduler:
  enabled: true
  threads: 5
  polling-interval: 10s
  table-name: scheduled_tasks
  immediate-execution-enabled: true
  shutdown-max-wait: 30s

# ── Server ──────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT}
  # H11: behind a reverse proxy (nginx, load balancer) on a private network,
  # take the client address from X-Forwarded-For so per-IP limits see real
  # clients. Tomcat trusts the header only from private-network proxies.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  shutdown: graceful

# ── Actuator ────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      # H17: details (database, disk) only for an ADMIN token; everyone else
      # sees {"status":"UP"} - enough for a load balancer.
      show-details: when-authorized
      roles: ADMIN

# ── Logging ─────────────────────────────────────────────────────────────────────
logging:
  config: classpath:log4j2.xml
