spring:
  application:
    name: rent-erp

  # ── DataSource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RentErpPool
      minimum-idle: 5
      maximum-pool-size: 20          # Higher pool suits virtual-thread concurrency
      idle-timeout: 300000           # 5 min
      connection-timeout: 20000      # 20 s
      max-lifetime: 1200000          # 20 min
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate             # Schema owned by Flyway — Hibernate validates only
    show-sql: false                  # SQL logged via Log4j2 (org.hibernate.SQL=DEBUG)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        connection.provider_disables_autocommit: false
        jdbc.time_zone: UTC

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Virtual Threads (Java 25 / Spring Boot 4.1) ──────────────────────────────
  threads:
    virtual:
      enabled: true

  # ── Security (open during dev — locked down once auth service is implemented) ─
  security:
    user:
      name: ${DEV_SECURITY_USER}
      password: ${DEV_SECURITY_PASSWORD}

# ── db-scheduler ────────────────────────────────────────────────────────────────
db-scheduler:
  enabled: true
  threads: 5
  polling-interval: 10s
  table-name: scheduled_tasks
  immediate-execution-enabled: true
  shutdown-max-wait: 30s

# ── Server ──────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT}

# ── Actuator ────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ─────────────────────────────────────────────────────────────────────
logging:
  config: classpath:log4j2.xml
